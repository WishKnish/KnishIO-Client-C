# C SDK publish — tag-driven GitHub Releases (cycle 182). Push a bare semver tag (e.g.
# `0.9.2`, no `v` prefix -- matches this repo's existing tag history: 0.8.0, 0.9.0, 0.9.2)
# -> version-consistency gate -> build/self-test/lint gate (mirrors ci.yml) -> package
# prebuilt binaries -> GitHub Release.
#
# Distribution channel: GitHub Releases only. Unlike the other 6 SDKs (npm x2, Packagist,
# Maven Central, crates.io, PyPI), the C SDK has no matching package registry for this
# dependency set (curl/cjson/gmp/openssl, optional liboqs/libwebsockets) -- a tagged GitHub
# Release with prebuilt tarballs *is* the publish target. Packaging mirrors the validator's
# proven pattern (servers/knishio-validator-rust/Makefile `package` targets): `cmake --install`
# to a staging tree (headers + shared/static libs + pkg-config + CMake package config, via the
# install() rules already in CMakeLists.txt), tarred per platform, with a SHAKE256SUMS manifest
# (FIPS 202 -- this project's default hash over SHA-2) computed over every shipped file.
#
# No OIDC/trusted-publishing here -- there is no registry to authenticate to, so auth is just
# GITHUB_TOKEN with `contents: write` to create the Release. Deliberately no top-level
# `environment:` key (unlike the JS/Rust publish.yml, which target an OIDC trusted-publisher
# environment): a GitHub deployment environment configured "protected branches only" REJECTS
# tag-triggered deploys, and there is no registry-side trusted-publisher config here that would
# need one. If an environment is added later for its own sake, it must explicitly allow tag refs.
#
# Source distribution: GitHub already auto-attaches a source zip/tarball to every Release, so
# this workflow does not build a custom source archive. That auto-generated archive (like any
# plain `git archive` of a tag) does NOT include the external/mlkem-native submodule (~100MB of
# pinned upstream history) -- building from it still requires `git submodule update --init`,
# exactly as the README already documents via `git clone --recursive`. Nothing changes there.
name: Publish

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write   # create the GitHub Release; no registry auth needed

jobs:
  version-gate:
    name: verify tag matches declared SDK version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Two independent places declare "what version is this SDK": CMakeLists.txt's
      # project(... VERSION ...) and the hardcoded KNISHIO_VERSION_STRING literal in
      # include/knishio/knishio.h. (src/config.h.in has no literal of its own -- it only
      # substitutes @PROJECT_VERSION@ from CMake at configure time, so knishio.h is the
      # real second source of truth.) A release must never be able to ship a version it
      # doesn't itself claim -- the C++ sibling SDK once let a stale binary report v0.9.1
      # after its own CMakeLists.txt had already moved to 0.9.2, undetected until an
      # external audit went looking. Fail here, before anything is built.
      - name: Verify tag == CMakeLists.txt VERSION == knishio.h KNISHIO_VERSION_STRING
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          CMAKE_VERSION=$(grep -A5 'project(' CMakeLists.txt | grep -oE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $2}')
          HEADER_VERSION=$(grep -oE 'KNISHIO_VERSION_STRING[[:space:]]+"[0-9]+\.[0-9]+\.[0-9]+"' include/knishio/knishio.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          echo "tag=$TAG  CMakeLists.txt=$CMAKE_VERSION  knishio.h=$HEADER_VERSION"

          mismatches=()
          [[ "$TAG" == "$CMAKE_VERSION" ]]  || mismatches+=("tag '$TAG' != CMakeLists.txt VERSION '$CMAKE_VERSION'")
          [[ "$TAG" == "$HEADER_VERSION" ]] || mismatches+=("tag '$TAG' != knishio.h KNISHIO_VERSION_STRING '$HEADER_VERSION'")

          if [[ ${#mismatches[@]} -gt 0 ]]; then
            echo "::error::version mismatch -- refusing to release"
            printf '::error::%s\n' "${mismatches[@]}"
            exit 1
          fi

          echo "OK: tag, CMakeLists.txt, and knishio.h all agree on $TAG"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  package:
    name: build + self-test + lint + package (${{ matrix.platform }})
    needs: version-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # fetch external/mlkem-native (vendored ML-KEM768)

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev libssl-dev \
            libgmp-dev libcjson-dev lsb-release wget software-properties-common gnupg

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config curl cjson gmp openssl@3

      # LLVM 22 + clang-tidy on Linux only, matching ci.yml (no macOS lint job exists there
      # either) -- the .clang-tidy bugprone-*/performance-* set was tuned against LLVM 22.
      - name: Install LLVM 22 (clang + clang-tidy, Linux only)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      - name: Configure (Linux, clang-22)
        if: runner.os == 'Linux'
        run: |
          CC=clang-22 CXX=clang++-22 cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DKNISHIO_BUILD_TESTS=ON \
            -DKNISHIO_BUILD_EXAMPLES=OFF \
            -DCLANG_TIDY_EXE="$(command -v clang-tidy-22)"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DKNISHIO_BUILD_TESTS=ON \
            -DKNISHIO_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build -j"$( (nproc || sysctl -n hw.ncpu) 2>/dev/null )"

      # Gate -- never release a tag that doesn't build/self-test/lint clean. Same build ci.yml
      # already proves; this job just extends it with install + package once it's green.
      - name: Self-test (frozen molecular hashes + ML-KEM768)
        run: |
          mkdir -p shared-test-results
          KNISHIO_DISABLE_CROSS_VALIDATION=true \
          KNISHIO_SHARED_RESULTS="$PWD/shared-test-results" \
            ./build/c_self_test

      - name: Unit tests (knishio_tests)
        run: ctest --test-dir build --output-on-failure

      - name: clang-tidy (lint gate, Linux only)
        if: runner.os == 'Linux'
        run: cmake --build build --target lint

      - name: Install to staging tree
        run: |
          set -euo pipefail
          STAGE_NAME="knishio-client-c-${{ needs.version-gate.outputs.version }}-${{ matrix.platform }}"
          echo "STAGE_NAME=$STAGE_NAME" >> "$GITHUB_ENV"
          cmake --install build --prefix "dist/$STAGE_NAME"
          # Unity (the vendored test framework, FetchContent'd for knishio_tests) has no
          # install COMPONENT of its own and rides along on `install()` -- it's a test-only
          # dependency, not part of the SDK product; strip it from the release artifact.
          rm -rf "dist/$STAGE_NAME/include/unity" "dist/$STAGE_NAME/lib/libunity.a" "dist/$STAGE_NAME/lib/cmake/unity"
          cp LICENSE README.md "dist/$STAGE_NAME/"

      - name: Compute SHAKE256SUMS (FIPS 202, matches the validator Makefile pattern)
        run: |
          cd "dist/$STAGE_NAME"
          python3 <<'PY'
          import hashlib, os
          lines = []
          for root, _dirs, files in os.walk('.'):
              for f in sorted(files):
                  if f == 'SHAKE256SUMS':
                      continue
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, '.')
                  h = hashlib.shake_256(open(p, 'rb').read()).hexdigest(32)
                  lines.append(f'{h}  {rel}')
          lines.sort(key=lambda l: l.split('  ', 1)[1])
          open('SHAKE256SUMS', 'w').write('\n'.join(lines) + '\n')
          PY

      - name: Create tarball
        run: tar czf "dist/${STAGE_NAME}.tar.gz" -C dist "$STAGE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: create GitHub Release
    needs: [version-gate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
