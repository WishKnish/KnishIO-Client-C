# C SDK CI — enforces the clang-tidy lint gate (cycle 115) + the build + c_self_test
# (the 6 frozen molecular-hash vectors + ML-KEM768) + the unit suites. Born-enforced:
# the repo had no CI, so the gate was local-only/bypassable until now.
#
# ML-KEM768 is provided by mlkem-native, vendored as a git submodule (external/mlkem-native)
# → checkout must be recursive. clang-tidy is version-sensitive (the .clang-tidy
# bugprone-*/performance-* globs were tuned against LLVM 22), so CI pins LLVM 22 and builds
# with clang-22 (clang-clean compile_commands.json for clang-tidy).
name: CI

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time. The publish workflow already
  # refuses a tag that disagrees with the manifest, but that only fires on a tag push, so
  # drift can sit in master until release day. Same script, no expected version: assert only
  # that the repo agrees with itself.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false (2026-08) — nothing here pushes; a kept token is readable from .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  gate:
    name: build + self-test + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # fetch external/mlkem-native (vendored ML-KEM)
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev libssl-dev \
            libgmp-dev libcjson-dev lsb-release wget software-properties-common gnupg

      # Pin LLVM 22 (matches the cycle-115 tuning) so the clang-tidy check set is reproducible.
      - name: Install LLVM 22 (clang + clang-tidy)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      # Build with clang-22 → the compile DB clang-tidy reads is clang-clean. EXPORT_COMPILE_COMMANDS
      # is on by default; -DCLANG_TIDY_EXE pins the tidy binary without a CMake edit.
      - name: Configure
        run: |
          CC=clang-22 CXX=clang++-22 cmake -S . -B build \
            -DKNISHIO_BUILD_TESTS=ON \
            -DCLANG_TIDY_EXE="$(command -v clang-tidy-22)"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Deterministic parity gate: the 6 frozen molecular hashes + ML-KEM768. Cross-SDK
      # validation is disabled (a single-repo checkout has no sibling SDK result dumps).
      - name: Self-test (frozen molecular hashes + ML-KEM768)
        run: |
          mkdir -p shared-test-results
          KNISHIO_DISABLE_CROSS_VALIDATION=true \
          KNISHIO_SHARED_RESULTS="$PWD/shared-test-results" \
            ./build/c_self_test

      - name: Unit tests (knishio_tests)
        run: ctest --test-dir build --output-on-failure

      # The release package's consumer gate on every push, not only at release: install to a
      # staging tree as publish.yml does (Unity stripped) and build packaging/consumer against
      # a relocated copy of it (headers alone, -I/-L, pkg-config, find_package shared + static).
      - name: 'Consumer build gate (relocated package: headers, -I/-L, pkg-config, find_package)'
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage/pkg"
          cmake --install build --prefix "$STAGE"
          rm -rf "$STAGE/include/unity" "$STAGE/lib/libunity.a" "$STAGE/lib/cmake/unity"
          bash packaging/check-release-package.sh "$STAGE" "$(sed -n '/^project(/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"

      # The cycle-115 lint gate (clang-tidy bugprone-*/performance-* over the first-party
      # sources, mlkem-native excluded). Last so a version-drift failure is cleanly isolated.
      - name: clang-tidy (lint gate)
        run: cmake --build build --target lint

  # The same build with the KnishIO Crypto Core linked (KNISHIO_USE_KCORE=ON), so the kcore path
  # the prebuilt release packages ship is proven on every push, not only at release. The kcore
  # package is the pinned 0.2.0 release asset, checked by sha256 before it is extracted.
  gate-kcore:
    name: build + self-test (kcore)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # fetch external/mlkem-native (vendored ML-KEM)
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev libssl-dev \
            libgmp-dev libcjson-dev lsb-release wget software-properties-common gnupg

      - name: Install LLVM 22 (clang)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Fetch kcore 0.2.0 (linux-x64-gnu, sha256-pinned)
        run: |
          set -euo pipefail
          PKG=knishio-crypto-core-0.2.0-linux-x64-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$PKG.tar.gz" \
            "https://github.com/WishKnish/KnishIO-Crypto-Core/releases/download/0.2.0/$PKG.tar.gz"
          echo "137a7adb73df0a1fe84656cf02d8e6513a6dec0a548ed9adc7c220dac71e4b05  $RUNNER_TEMP/$PKG.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kcore"
          tar -xzf "$RUNNER_TEMP/$PKG.tar.gz" -C "$RUNNER_TEMP/kcore" --strip-components=1

      - name: Configure (kcore ON)
        run: |
          set -euo pipefail
          CC=clang-22 CXX=clang++-22 cmake -S . -B build-kcore \
            -DKNISHIO_USE_KCORE=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/kcore" \
            -DKNISHIO_BUILD_TESTS=ON \
            -DKNISHIO_BUILD_EXAMPLES=OFF | tee "$RUNNER_TEMP/configure-kcore.log"
          grep -F 'kcore: KnishIOCryptoCore 0.2.0' "$RUNNER_TEMP/configure-kcore.log"

      - name: Build
        run: cmake --build build-kcore -j"$(nproc)"

      - name: Self-test (frozen molecular hashes + ML-KEM768, kcore)
        run: |
          mkdir -p shared-test-results
          KNISHIO_DISABLE_CROSS_VALIDATION=true \
          KNISHIO_SHARED_RESULTS="$PWD/shared-test-results" \
            ./build-kcore/c_self_test

      - name: Unit tests (knishio_tests, kcore)
        run: ctest --test-dir build-kcore --output-on-failure

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have. No submodules needed: this job only reads text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # If the CMake `project(... VERSION ...)` line changed relative to the base commit,
      # CHANGELOG.md must carry a matching `## [<version>]` heading. No change → no-op.
      # The line-anchored `VERSION` match picks up the project version and not
      # `cmake_minimum_required(VERSION ...)`, which is mid-line.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9A-Za-z.+-]*\).*/\1/p' "$1" | head -1; }
          git show "$BASE:CMakeLists.txt" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver CMakeLists.txt); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
